# Runs on every push and pull request. A red check means something needs fixing before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # src/env.ts requires DATABASE_URL, and the build checks it. CI never talks to
      # the database, so a placeholder is enough. Vercel gets the real value.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      # Bun installs and runs scripts, but Vite and SvelteKit run on Node (their bins use
      # `#!/usr/bin/env node`). Pin it so CI doesn't depend on the runner's preinstalled version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile fails if bun.lock is out of date, so CI installs exactly what we tested locally.
      - run: bun install --frozen-lockfile

      # Component tests run in a real (headless) browser.
      - run: bunx playwright install --with-deps chromium

      - run: bun run lint
      - run: bun run check
      - run: bun run test:unit --run
      - run: bun run build
