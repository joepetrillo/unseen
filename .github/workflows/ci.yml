# Runs on every push and pull request. A red check means something needs fixing before merging.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # Pinned rather than ubuntu-latest (moving to Ubuntu 26 from Oct 2026): Playwright's
    # --with-deps system packages can lag a new Ubuntu release. Revisit at launch (spec stage 10).
    runs-on: ubuntu-24.04
    # A throwaway database for the tests that need one, on the same major version as Neon.
    # It starts empty each run; the migrations step below creates the tables.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        # Steps wait until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      # src/env.ts requires these, and the build checks them. Both database URLs point at the
      # service above (no pooler here, so they're the same). CI never signs anyone in, so the
      # secret is a placeholder. Vercel gets the real values.
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      # Bun installs and runs scripts, but Vite and SvelteKit run on Node (their bins use
      # `#!/usr/bin/env node`). Pin it so CI doesn't depend on the runner's preinstalled version.
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2

      # --frozen-lockfile fails if bun.lock is out of date, so CI installs exactly what we tested locally.
      - run: bun install --frozen-lockfile

      # Component tests run in a real (headless) browser.
      - run: bunx playwright install --with-deps chromium

      - run: bun run lint
      - run: bun run check
      # The same committed migrations Vercel applies on deploy.
      - run: bun run db:migrate
      - run: bun run test:unit --run
      - run: bun run build
